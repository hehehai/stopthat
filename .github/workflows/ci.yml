name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"

      - name: Test
        run: CGO_ENABLED=0 go test -v ./...

      - name: Vet all platforms
        run: |
          CGO_ENABLED=0 go vet ./...
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go vet ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go vet ./...

      - name: Cross-compile Windows & macOS
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H=windowsgui" -o build/StopThat-windows-amd64.exe .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o build/StopThat-darwin-arm64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o build/StopThat-darwin-amd64 .
